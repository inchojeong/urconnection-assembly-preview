<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UR Connection · 작업자 목록</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="shared-extra.css" />
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="rail-brand"><div class="mark">UR</div><div><p class="name">UR Connection</p><p class="ver">local preview</p></div></div>
      <p class="rail-sec">WORKSPACE</p>
      <nav class="rail-nav" data-shell-nav></nav>
      <div class="rail-foot">
        <div class="user-chip"><div class="avatar">AD</div><div><strong>관리자</strong><span>Administrator</span></div></div>
        <button type="button" class="logout">로그아웃</button>
      </div>
    </aside>
    <div class="content">
      <header class="topbar">
        <div>
          <h1>기술자 목록</h1>
          <p class="meta">기술자별 Skill History · 숙련도 평가 이력</p>
        </div>
        <div class="top-actions">
          <a class="btn primary" href="workers-register.html">기술자 등록</a>
        </div>
      </header>
      <main class="main">
        <section class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>작업자명</th><th>소속</th><th>직종/직무</th><th>총 작업영상</th>
                  <th>최근 작업</th><th>평균 숙련도</th><th>평균 작업시간</th><th>주요 오류</th><th></th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script>
    mountShell("workers");
    document.getElementById("tbody").innerHTML = UR_DATA.workers.map(w => `
      <tr>
        <td><span class="name">${w.name}</span><span class="id">${w.id}</span></td>
        <td>${w.org}</td>
        <td>${w.job}</td>
        <td>${w.videos}</td>
        <td>${w.recent}</td>
        <td><span style="color:var(--brand);font-weight:700;">${w.avg_skill}</span></td>
        <td>${w.avg_time}</td>
        <td>${w.errors}건</td>
        <td><a class="linkish" href="worker-detail.html">상세</a></td>
      </tr>
    `).join("");
  </script>
</body>
</html>

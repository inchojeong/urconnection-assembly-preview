<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UR Connection · 기술자 등록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="shared-extra.css" />
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="rail-brand">
        <div class="mark">UR</div>
        <div>
          <p class="name">UR Connection</p>
          <p class="ver">local preview</p>
        </div>
      </div>
      <p class="rail-sec">WORKSPACE</p>
      <nav class="rail-nav" data-shell-nav></nav>
      <div class="rail-foot">
        <div class="user-chip">
          <div class="avatar">AD</div>
          <div>
            <strong>관리자</strong>
            <span>Administrator</span>
          </div>
        </div>
        <button type="button" class="logout">로그아웃</button>
        <p class="local-tag">LOCAL · github 미반영</p>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <div>
          <h1>기술자 등록</h1>
          <p class="meta">작업자 ID · 직종 · 소속 정보를 등록합니다</p>
        </div>
        <div class="top-actions">
          <a class="btn" href="workers-list.html">목록</a>
          <a class="btn" href="report-pdf.html">결과 PDF</a>
        </div>
      </header>

      <main class="main">
        <section class="card">
          <div class="card-h">
            <div>
              <h2>등록할 내용</h2>
              <p>필수 항목만 채우면 등록할 수 있습니다. ID는 저장 시 자동으로 붙습니다.</p>
            </div>
            <span class="badge" id="id-preview">예상 ID W-006</span>
          </div>
          <div class="card-b">
            <form id="reg-form" novalidate>
              <div class="stack">
                <div class="grid-2">
                  <label class="field">
                    <span>이름<span class="req">*</span></span>
                    <input name="name" type="text" placeholder="예: DO TIEN DUC" autocomplete="name" />
                    <span class="err" data-err="name"></span>
                  </label>
                  <label class="field">
                    <span>국적<span class="req">*</span></span>
                    <select name="nationality">
                      <option value="">선택</option>
                      <option>베트남</option>
                      <option>우즈베키스탄</option>
                      <option>네팔</option>
                      <option>태국</option>
                      <option>필리핀</option>
                      <option>한국</option>
                      <option>기타</option>
                    </select>
                    <span class="err" data-err="nationality"></span>
                  </label>
                  <label class="field">
                    <span>나이</span>
                    <input name="age" type="number" min="18" max="70" placeholder="예: 28" />
                    <span class="err" data-err="age"></span>
                  </label>
                  <label class="field">
                    <span>주 직종<span class="req">*</span></span>
                    <select name="job">
                      <option value="">선택</option>
                      <option>분해조립</option>
                      <option>금형조립</option>
                      <option>기계가공</option>
                      <option>용접</option>
                      <option>프레스</option>
                      <option>사출</option>
                    </select>
                    <span class="err" data-err="job"></span>
                  </label>
                  <label class="field">
                    <span>에이전시</span>
                    <input name="agency" type="text" value="URCONNECTION" />
                    <span class="err" data-err="agency"></span>
                  </label>
                  <label class="field">
                    <span>회사<span class="req">*</span></span>
                    <input name="company" type="text" placeholder="예: 서용건설(주)" />
                    <span class="err" data-err="company"></span>
                  </label>
                  <label class="field">
                    <span>등록일</span>
                    <input name="registeredAt" type="date" />
                    <span class="err" data-err="registeredAt"></span>
                  </label>
                  <label class="field">
                    <span>연락처</span>
                    <input name="phone" type="tel" placeholder="선택" />
                    <span class="err" data-err="phone"></span>
                  </label>
                </div>

                <label class="field">
                  <span>메모</span>
                  <textarea name="memo" placeholder="현장 특이사항, 배정 비고 등"></textarea>
                </label>

                <p class="help">
                  등록 후에는 기술자 목록에서 조회할 수 있습니다. 수정·비활성 처리는 내부 관리 화면에서 이어갈 예정입니다.
                </p>

                <div class="actions-bar">
                  <button type="button" class="btn" id="btn-reset">초기화</button>
                  <button type="submit" class="btn primary">기술자 등록</button>
                </div>
              </div>
            </form>
          </div>
        </section>

        <section class="card" id="result-card" hidden>
          <div class="card-h">
            <div>
              <h2>등록 결과</h2>
              <p>로컬 미리보기용으로 브라우저에만 저장됩니다.</p>
            </div>
          </div>
          <div class="card-b">
            <div class="info-row" id="result-boxes"></div>
            <div class="actions-bar">
              <button type="button" class="btn primary" id="btn-another">이어서 등록</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="workers-register.js"></script>
</body>
</html>
